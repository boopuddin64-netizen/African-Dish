name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      # The Firestore emulator (npm test) needs a Java runtime.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Type-check app
        run: npx tsc --noEmit

      - name: Install & type-check Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Build app
        run: npx vite build

      - name: Tests (Firestore emulator: rules, role flow, unit tests)
        run: npm test
